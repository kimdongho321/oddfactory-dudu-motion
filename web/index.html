<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>두두 모션 뷰어</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#2f3a2a;--sub:#7b8572;--line:#e2ddd0;--accent:#7cb342}
body.dark{--bg:#15171c;--card:#1f232a;--ink:#e6f2ea;--sub:#93a39a;--line:#30363f;--accent:#4fe3b5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;transition:background .4s}
main{max-width:1100px;margin:auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--sub);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.stage{border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;min-height:460px;position:relative;background:var(--card)}
canvas{image-rendering:pixelated;max-width:100%}
.hud{position:absolute;left:12px;top:10px;font-size:12px;color:var(--sub)}
aside section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
aside h2{font-size:13px;margin:0 0 8px;color:var(--sub)}
button{font:inherit;color:inherit;border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left}
button.on{background:var(--accent);border-color:var(--accent);color:#111}
.list{display:flex;flex-direction:column;gap:5px}
.list small{display:block;color:var(--sub);font-size:11px}
button.on small{color:#222}
.row{display:flex;gap:6px;flex-wrap:wrap}
input[type=range]{width:100%}
</style>
</head>
<body>
<main>
  <h1>두두 도트 모션</h1>
  <p class="sub">원본 도트를 프레임마다 편집해서 만든 모션입니다. 일반 / 야광 전환은 휴대폰 다크모드·밝기 낮춤과 연결할 예정입니다. 각 버튼 아래 회색 글씨가 연결할 이벤트입니다.</p>
  <div class="grid">
    <div class="stage"><canvas id="cv"></canvas><div class="hud" id="hud"></div><div id="notice" style="display:none;position:absolute;top:34px;left:12px;right:12px;background:#ffcf5a;color:#222;border-radius:8px;padding:6px 10px;font-size:13px">야광 버전은 아직 제작 중이라 일반 그림으로 보여주고 있습니다.</div></div>
    <aside>
      <section><h2>화면 모드 (다크모드·밝기 낮춤 = 야광)</h2>
        <div class="row"><button id="mNormal" class="on">일반</button><button id="mGlow">야광</button></div></section>
      <section><h2>이벤트 → 모션</h2><div class="list" id="list"></div></section>
      <section><h2>재생</h2>
        <div class="row"><button id="play">일시정지</button><button id="prev">◀ 한 칸</button><button id="next">한 칸 ▶</button></div>
        <label style="display:block;margin-top:10px;font-size:13px">크기 <b id="scv"></b><input type="range" id="sc" min="1" max="4" step="1" value="2"></label>
      </section>
    </aside>
  </div>
</main>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const V = Date.now();
  const M = await (await fetch('motions.json?v=' + Date.now(), {cache: 'no-store'})).json();
  const cache = {}; const load = n => cache[n] || (cache[n] = new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = 'frames/' + n + '?v=' + V; }));
  let msList = [], mode = 'normal', cur = 'idle', idx = 0, playing = true, last = 0, imgs = [];
  const cv = $('cv'), ctx = cv.getContext('2d');
  async function refresh() {
    const ready = M[cur][mode] && M[cur][mode].length; const list = ready ? M[cur][mode] : M[cur].normal; imgs = await Promise.all(list.map(load)); msList = ready ? (M[cur]['ms_' + mode] || M[cur].ms) : M[cur].ms; $('notice').style.display = (mode === 'glow' && !ready) ? 'block' : 'none'; if (idx >= imgs.length) idx = 0;
    const s = +$('sc').value; cv.width = imgs[0].width * s; cv.height = imgs[0].height * s; $('scv').textContent = s + '배';
    [...$('list').children].forEach(b => b.classList.toggle('on', b.dataset.k === cur));
    $('mNormal').classList.toggle('on', mode === 'normal'); $('mGlow').classList.toggle('on', mode === 'glow');
    document.body.classList.toggle('dark', mode === 'glow'); draw();
  }
  function draw() { if (!imgs.length) return; ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(imgs[idx], 0, 0, cv.width, cv.height);
    $('hud').textContent = `${M[cur].label} · ${M[cur].play} · ${idx + 1}/${imgs.length}`; }
  $('list').replaceChildren(...Object.entries(M).map(([k, m]) => { const b = document.createElement('button'); b.dataset.k = k; b.innerHTML = `${k}<small>${m.label} · ${m.play}</small>`; b.onclick = () => { cur = k; idx = 0; refresh(); }; return b; }));
  $('mNormal').onclick = () => { mode = 'normal'; cur = 'switch'; idx = 0; refresh(); };
  $('mGlow').onclick = () => { mode = 'glow'; cur = 'switch'; idx = 0; refresh(); };
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '일시정지' : '재생'; };
  $('prev').onclick = () => { playing = false; $('play').textContent = '재생'; idx = (idx - 1 + imgs.length) % imgs.length; draw(); };
  $('next').onclick = () => { playing = false; $('play').textContent = '재생'; idx = (idx + 1) % imgs.length; draw(); };
  $('sc').oninput = refresh;
  await refresh();
  requestAnimationFrame(function tick(t) {
    const msv = msList[idx] || 120;
    if (playing && t - last >= msv) { last = t; idx++;
      const lt = M[cur].loopTo; if (lt !== undefined && idx > lt) { idx = M[cur].loopFrom; }
      if (idx >= imgs.length) { idx = 0; if (M[cur].play === '1회') { cur = 'idle'; refresh(); } } draw(); }
    requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
